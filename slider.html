<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The City Square</title>
    <link rel="stylesheet" href="slider.css" />
  </head>
  <body>
    <section class="hero-slider-wrapper">
      <div class="hero-slider-track" id="sliderTrack">
        <div class="slide">
          <img src="images/clothes.png" alt="Promo Banner 1" />
        </div>
        <div class="slide">
          <img src="images/pen4.png" alt="Promo Banner 2" />
        </div>
        <div class="slide">
          <img src="images/pen5.png" alt="Promo Banner 3" />
        </div>
        <div class="slide">
          <img src="images/accessories.png" alt="Promo Banner 4" />
        </div>
        <div class="slide">
          <img src="images/shoes.png" alt="Promo Banner 5" />
        </div>
      </div>
      <button class="slider-arrow prev-arrow" onclick="moveSlide(-1)">
        &#10094;
      </button>
      <button class="slider-arrow next-arrow" onclick="moveSlide(1)">
        &#10095;
      </button>
    </section>
    <script>
      let currentIndex = 0;
      function moveSlide(direction) {
        const track = document.getElementById("sliderTrack");
        const totalSlides = document.querySelectorAll(".slide").length;

        currentIndex += direction;

        if (currentIndex < 0) currentIndex = 0;
        if (currentIndex >= totalSlides) currentIndex = totalSlides - 1;

        track.style.transform = `translateX(-${currentIndex * 100}%)`;
      }
    </script>
  </body>
</html>
