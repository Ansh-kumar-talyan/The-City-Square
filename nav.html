<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The City Square</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500&family=Playfair+Display:wght@700;800&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="nav.css" />
  </head>
  <body>
    <header class="navbar">
      <div class="nav-brand">
        <div class="logo-box">
          <img
            src="images/logo.png"
            alt="Logo"
            width="90"
            height="90"
            class="logo"
          />
        </div>
        <div class="brand-text">
          <span class="site-name">The City Square</span>
          <span class="site-quote">community and commerce</span>
        </div>
      </div>
      <div class="nav-address nav-box">
        <img
          src="images/address.png"
          alt="Location"
          width="18"
          height="18"
          class="address-icon"
        />
        <div class="address-text">
          <span class="location">Select your address</span>
        </div>
      </div>
      <div class="nav-search">
        <input type="text" placeholder="Search..." />
      </div>
      <div class="nav-actions">
        <a href="/cart" class="nav-cart nav-box">🛒 Cart</a>
        <div class="auth-buttons">
          <a href="/login" class="btn-login nav-box">Log In</a>
          <a href="/signin" class="btn-signin nav-box">Sign In</a>
        </div>
      </div>
    </header>
  </body>
</html>
